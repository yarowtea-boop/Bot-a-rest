<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Donate to AllianceBot</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">A</span>
        <div>
          <div class="brand-name">AllianceBot</div>
          <div class="brand-tag">Support the project</div>
        </div>
      </div>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="ai-wikipedia-soon.html">AI Wikipedia</a>
        <a href="donate.html" aria-current="page">Donate</a>
      </nav>
    </header>

    <section class="card donate-card">
      <p class="eyebrow">Crypto donation address</p>
      <h1>anything helps, thank you have a blessed life</h1>
      <div class="address-box">
        <code id="address">0xF0ae44b82b64CD3b53aaA3AB59dAe53E7980745d</code>
        <button class="button primary" id="copy-address" type="button">Copy Address</button>
      </div>
    </section>
  </main>

  <script>
    const button = document.getElementById('copy-address');
    const address = document.getElementById('address').textContent;
    button.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(address);
        button.textContent = 'Copied';
        setTimeout(() => (button.textContent = 'Copy Address'), 1400);
      } catch (error) {
        button.textContent = 'Copy failed';
        setTimeout(() => (button.textContent = 'Copy Address'), 1400);
      }
    });
  </script>
</body>
</html>
